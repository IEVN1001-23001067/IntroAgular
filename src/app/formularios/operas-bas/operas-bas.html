<div class="container">
    <div class="row">
        <div class="col-6">
            <form>
                <div class="form-group pt-4">
                    <label for="num1">Número 1:</label>
                    <input [(ngModel)]="num1" name="num1" type="text" class="form-control" id="num1" placeholder="Ingrese número 1">
                </div>
                <div class="form-group pt-4">
                    <label for="num2">Número 2:</label>
                    <input [(ngModel)]="num2" name="num2" type="text" class="form-control" id="num2" placeholder="Ingrese Número 2">
                </div>

                <div class="form-group pt-3">
                    <label for="operacion">Selecciona una:</label>
                    <select [(ngModel)]="operacion" name="operacion" class="form-control" id="operacion">
                        <option value="sumar">Sumar</option>
                        <option value="restar">Restar</option>
                        <option value="multiplicar">Multiplicar</option>
                        <option value="dividir">Dividir</option>
                    </select>
                </div>

                <br>
                <button (click)="calcular()" type="button" class="btn btn-primary">Calcular</button>
            </form>
        </div>
        
        <div class="col-6">
            <h2>Resultado: {{resultado}}</h2>
        </div>
    </div>
</div>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palíndromo</title>
</head>
<body>
    <div>
  <h2>Usa el Palíndromo</h2>

  <input 
    type="text" 
    [(ngModel)]="frase" 
    placeholder="Escribe una frase..." 
  />

  <br><br>

  <button (click)="analizar()">Analizar</button>

  <div *ngIf="mostrar">
    <p>Vocales: {{ vocales }}</p>
    <p>Consonantes: {{ consonantes }}</p>
    <p>¿Es palíndromo?: {{ esPalindromo ? 'Sí' : 'No' }}</p>
  </div>
</div>
</body>
</html>

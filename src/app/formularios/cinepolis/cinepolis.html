<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinepolis</title>
</head>
<div class="contenedor-principal">
    <div class="titulo-principal">Cinepolis</div> 
    
    <div class="secciones">
        
        <fieldset class="caja">
            <legend>Entradas</legend>
            
            <div class="campo">
                <label>Nombre</label>
                <input type="text" [(ngModel)]="nombre">
            </div>

            <div class="campo">
                <label>Cantidad Compradores</label>
                <input type="number" [(ngModel)]="cantidadCompradores" min="1">
            </div>

            <div class="campo">
                <label>Tarjeta Cineco</label>
                <div class="radios">
                    <label><input type="radio" name="cineco" [(ngModel)]="cineco" value="si"> Sí</label>
                    <label><input type="radio" name="cineco" [(ngModel)]="cineco" value="no"> No</label>
                </div>
            </div>

            <div class="campo">
                <label>Cantidad De Boletos</label>
                <input type="number" [(ngModel)]="cantidadBoletos" min="1">
            </div>
        </fieldset>

        
        <fieldset class="caja">
            <legend>Salidas</legend>
            <div class="campo">
                <label>Valor a Pagar</label>
                <input type="text" [value]="'$ ' + valorPagar" readonly class="input-resultado">
            </div>
        </fieldset>
    </div>

    
    <fieldset class="caja acciones">
        <legend>Acciones</legend>
        <button (click)="procesar()">Procesar</button>
        <button (click)="salir()">Salir</button>
    </fieldset>

    <div class="footer-cinepolis">
        <h2>Cinépolis</h2>
        <p>LA CAPITAL DEL CINE</p>
    </div>
</div>
</html>
